/root/wordpress-sites/group-shop/runtime/security-logs/nginx/*.jsonl {
    daily
    rotate 30
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    sharedscripts
    postrotate
        /usr/bin/docker exec group-shop-nginx-1 nginx -s reopen >/dev/null 2>&1 || true
    endscript
}
