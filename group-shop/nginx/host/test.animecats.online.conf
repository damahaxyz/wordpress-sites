server {
    listen 80;
    listen [::]:80;
    server_name test.animecats.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://test.animecats.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test.animecats.online;
    ssl_certificate /root/ssl/group-shop-test/fullchain.pem;
    ssl_certificate_key /root/ssl/group-shop-test/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:group_shop_test_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;
    access_log /var/log/nginx/group-shop-test.access.log main;
    error_log /var/log/nginx/group-shop-test.error.log;

    # Only Cloudflare's published networks may supply the visitor IP header.
    include /etc/nginx/group-shop-cloudflare-realip.inc;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
