server {
    listen 80;
    listen [::]:80;
    server_name www.animecats.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        default_type text/plain;
        return 503 "Group Shop deployment in progress\n";
    }
}
