file_uploads = On
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 500M
max_execution_time = 600
max_input_time = 600
; PHP-FPM must not launch shell commands or external processes.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork
allow_url_include = Off
display_errors = Off
expose_php = Off
