# Local QA only. Included last by the existing Homebrew Apache configuration.
# Preserve the pre-existing default website for every other Host header.
<VirtualHost *:80>
    ServerName localhost
</VirtualHost>

<IfModule !proxy_module>
    LoadModule proxy_module lib/httpd/modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module lib/httpd/modules/mod_proxy_http.so
</IfModule>

<VirtualHost *:80>
    ServerName www.main.local
    ServerAlias www.branda.local www.brandb.local www.brandc.local www.brande.local www.brandf.local www.brandg.local
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:18087/ connectiontimeout=5 timeout=180
    ProxyPassReverse / http://127.0.0.1:18087/
    <Location />
        Require local
    </Location>
</VirtualHost>
