name: group-shop-manager-qa
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: gsm_qa
      MARIADB_USER: gsm_qa
      MARIADB_PASSWORD: ${GSM_QA_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${GSM_QA_ROOT_PASSWORD}
    volumes:
      - qa_db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 30
  wordpress:
    image: wordpress:7.0-php8.3-fpm
    environment: &qa_environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: gsm_qa
      WORDPRESS_DB_USER: gsm_qa
      WORDPRESS_DB_PASSWORD: ${GSM_QA_DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      GSM_QA_MULTISITE: ${GSM_QA_MULTISITE:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        if (getenv('GSM_QA_MULTISITE') === '1') {
          define('WP_ALLOW_MULTISITE', true);
          define('MULTISITE', true);
          define('SUBDOMAIN_INSTALL', false);
          define('DOMAIN_CURRENT_SITE', '${GSM_QA_DOMAIN:-localhost:${GSM_QA_PORT:-18086}}');
          define('PATH_CURRENT_SITE', '/');
          define('SITE_ID_CURRENT_SITE', 1);
          define('BLOG_ID_CURRENT_SITE', 1);
        }
    volumes: &qa_volumes
      - qa_wordpress:/var/www/html
      - ./plugin/muti-storefront-plugin:/var/www/html/wp-content/plugins/muti-storefront-plugin:ro
      - ./plugin/product-addon-plugin:/var/www/html/wp-content/plugins/product-addon-plugin:ro
      - ./theme/trovesia:/var/www/html/wp-content/themes/trovesia:ro
      - ./tests/group-shop-manager/qa-mail-guard.php:/var/www/html/wp-content/mu-plugins/qa-mail-guard.php:ro
      - ./tests/group-shop-manager:/gsm-tests:ro
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:1.28-alpine
    networks:
      default:
        aliases:
          - www.main.local
          - www.branda.local
          - www.brandb.local
          - www.brandc.local
          - www.brande.local
          - www.brandf.local
          - www.brandg.local
    ports:
      - 127.0.0.1:${GSM_QA_PORT:-18086}:80
    volumes:
      - qa_wordpress:/var/www/html:ro
      - ./plugin/muti-storefront-plugin:/var/www/html/wp-content/plugins/muti-storefront-plugin:ro
      - ./plugin/product-addon-plugin:/var/www/html/wp-content/plugins/product-addon-plugin:ro
      - ./theme/trovesia:/var/www/html/wp-content/themes/trovesia:ro
      - ./scripts/group-shop-manager/nginx.qa.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wordpress
  wpcli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: 0:0
    environment: *qa_environment
    volumes: *qa_volumes
    depends_on:
      db:
        condition: service_healthy
volumes:
  qa_db:
  qa_wordpress:
