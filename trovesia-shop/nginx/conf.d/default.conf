fastcgi_cache_path /var/cache/nginx/trovesia
    levels=1:2
    keys_zone=TROVESIA_PAGE_CACHE:32m
    max_size=512m
    inactive=60m
    use_temp_path=off;

map $request_method $trovesia_cache_method {
    default $request_method;
    HEAD GET;
}

map $request_method $trovesia_skip_method {
    default 1;
    GET 0;
    HEAD 0;
}

map $args $trovesia_skip_query {
    default 1;
    "" 0;
}

map $request_uri $trovesia_skip_uri {
    default 0;
    ~*^/(?:cart|checkout|my-account)(?:/|$) 1;
    ~*^/(?:wp-admin|wp-login\.php|wp-cron\.php|xmlrpc\.php)(?:/|$|\?) 1;
    ~*^/(?:wp-json|wc-api)(?:/|$) 1;
    ~*^/feed(?:/|$) 1;
}

map $http_cookie $trovesia_skip_cookie {
    default 0;
    ~*(?:wordpress|wp-postpass|comment_author|woocommerce_|wp_woocommerce_session_|PHPSESSID) 1;
}

map $http_authorization $trovesia_skip_authorization {
    default 1;
    "" 0;
}

map "$trovesia_skip_method:$trovesia_skip_query:$trovesia_skip_uri:$trovesia_skip_cookie:$trovesia_skip_authorization" $trovesia_skip_cache {
    default 0;
    ~1 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 128m;

    set $trovesia_cache_generation "bootstrap";
    include /var/run/trovesia-page-cache/generation.conf;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300s;

        fastcgi_cache TROVESIA_PAGE_CACHE;
        fastcgi_cache_key "$scheme|$trovesia_cache_method|$host|$request_uri|$trovesia_cache_generation";
        fastcgi_cache_bypass $trovesia_skip_cache;
        fastcgi_no_cache $trovesia_skip_cache;
        fastcgi_cache_valid 200 10m;
        fastcgi_cache_min_uses 1;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 10s;
        fastcgi_cache_lock_age 10s;
        fastcgi_cache_background_update on;
        fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503;

        add_header X-Trovesia-Cache $upstream_cache_status always;
    }

    location = /wp-config.php {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
