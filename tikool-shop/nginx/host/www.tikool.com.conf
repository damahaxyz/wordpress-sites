server {
    listen 80;
    listen [::]:80;
    server_name tikool.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    return 301 https://www.tikool.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.tikool.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    return 301 https://www.tikool.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tikool.com;

    ssl_certificate /root/ssl/tikool-cloudflare-origin.pem;
    ssl_certificate_key /root/ssl/tikool-cloudflare-origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:tikool_shop_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.tikool.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tikool.com;

    ssl_certificate /root/ssl/tikool-cloudflare-origin.pem;
    ssl_certificate_key /root/ssl/tikool-cloudflare-origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:tikool_shop_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ~ /\\.ht {
        deny all;
    }
}
