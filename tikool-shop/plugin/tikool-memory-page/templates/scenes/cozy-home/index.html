<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5eee4">
  <title>Memory Page</title>
  <style>
    :root{--cream:#f5eee4;--paper:#fffaf3;--ink:#392d27;--muted:#7c6b61;--rust:#b96545;--sage:#7d8a70;--line:#dfd1c5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 ui-rounded,"Avenir Next",Avenir,system-ui,sans-serif}body:before{background:radial-gradient(circle at 16% 8%,#fff9 0 13%,transparent 38%),radial-gradient(circle at 90% 24%,#c9d1bd66,transparent 31%);content:"";inset:0;pointer-events:none;position:fixed}.shell{margin:auto;max-width:1120px;padding:clamp(22px,5vw,72px);position:relative}.hero{align-items:center;display:grid;gap:clamp(28px,6vw,76px);grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);min-height:78vh}.hero-photo{background:#dec9b8;border:12px solid #fff8ee;border-radius:46% 46% 18px 18px;box-shadow:0 28px 80px #6a443128;min-height:420px;overflow:hidden;transform:rotate(-1.4deg)}.hero-photo img{display:block;height:100%;max-height:72vh;min-height:420px;object-fit:cover;width:100%}.eyebrow{color:var(--rust);font-size:.74rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(3.5rem,10vw,7.6rem);font-weight:400;letter-spacing:-.055em;line-height:.84;margin:.18em 0}.subtitle{color:var(--sage);font-family:Georgia,serif;font-size:clamp(1.2rem,2vw,1.55rem);margin:0}.story{background:var(--paper);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px #72514114;margin:clamp(46px,9vw,110px) 0;padding:clamp(28px,6vw,70px);position:relative}.story:before{color:#dba488;content:"“";font:8rem/1 Georgia,serif;left:22px;opacity:.35;position:absolute;top:10px}.story h2,.section h2{font:400 clamp(2rem,5vw,4rem)/1.05 Georgia,serif;margin:0 0 1.2rem}.story p{color:var(--muted);font:clamp(1.05rem,2vw,1.32rem)/1.85 Georgia,serif;margin:0 auto;max-width:780px;white-space:pre-line}.gallery{display:grid;gap:18px;grid-template-columns:repeat(12,1fr);margin:0 0 clamp(60px,10vw,120px)}.gallery figure{background:#fffaf4;border-radius:18px;box-shadow:0 14px 45px #5840331b;grid-column:span 4;margin:0;overflow:hidden;padding:10px}.gallery figure:nth-child(4n+1){grid-column:span 7}.gallery figure:nth-child(4n+2){grid-column:span 5}.gallery img{aspect-ratio:4/3;border-radius:12px;display:block;height:100%;object-fit:cover;width:100%}.section{border-top:1px solid var(--line);padding:clamp(48px,8vw,90px) 0}.section-head{align-items:end;display:flex;gap:2rem;justify-content:space-between;margin-bottom:2rem}.section-head p{color:var(--muted);margin:0;max-width:360px}.timeline{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}.moment{background:#fff9f0;border:1px solid #eaded2;border-radius:20px;padding:1.4rem}.moment time{color:var(--rust);font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.moment h3{font:400 1.45rem/1.2 Georgia,serif;margin:.35rem 0}.moment p{color:var(--muted);margin:0;white-space:pre-line}.media-list{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}.media-list video{background:#251d19;border-radius:18px;max-height:72vh;width:100%}.audio-card{background:#fff9f0;border:1px solid var(--line);border-radius:16px;padding:1rem}.audio-card span{display:block;font-size:.82rem;font-weight:700;margin-bottom:.65rem;overflow-wrap:anywhere}.audio-card audio{width:100%}.footer{color:var(--muted);padding:3rem 0;text-align:center}.footer strong{color:var(--ink);font:400 1.4rem Georgia,serif}.loading,.error{display:grid;min-height:100vh;place-items:center;text-align:center}.error{color:#8f4035}@media(max-width:720px){.shell{padding:20px}.hero{display:flex;flex-direction:column-reverse;min-height:auto;padding:36px 0 64px}.hero-copy{align-self:stretch}.hero-photo,.hero-photo img{min-height:360px;width:100%}.hero h1{font-size:clamp(3.7rem,22vw,6rem)}.gallery figure,.gallery figure:nth-child(n){grid-column:span 12}.timeline,.media-list{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column;gap:.3rem}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main class="shell" id="app"><p class="loading">Opening this memory…</p></main>
  <script>
    window.__TIKOOL_MEMORY_MANIFEST__=__TIKOOL_MEMORY_MANIFEST_JSON__;
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    const videos=items=>items.map(x=>`<video controls preload="metadata" playsinline src="${esc(x.src)}" aria-label="${esc(x.name||"Pet memory video")}"></video>`).join("");
    const sounds=items=>items.map(x=>`<div class="audio-card"><span>${esc(x.name||"A favorite sound")}</span><audio controls preload="metadata" src="${esc(x.src)}"></audio></div>`).join("");
    try{
      const m=window.__TIKOOL_MEMORY_MANIFEST__;if(!m||typeof m!=="object")throw Error("invalid manifest");
      const pet=String(m.pet?.name||m.title||"Our favorite companion"),title=String(m.title||"");
      const photos=m.media?.photos||[],video=m.media?.videos||[],audio=m.media?.audio||[],timeline=m.timeline||[];
      document.title=title||pet;
      const hero=photos[0]?`<div class="hero-photo"><img src="${esc(photos[0].src)}" alt="${esc(pet)}" fetchpriority="high"></div>`:"";
      const gallery=photos.length>1?`<section class="gallery" aria-label="Photo memories">${photos.slice(1).map(x=>`<figure><img src="${esc(x.src)}" alt="${esc(pet)}" loading="lazy"></figure>`).join("")}</section>`:"";
      document.getElementById("app").innerHTML=`<header class="hero"><div class="hero-copy"><p class="eyebrow">Our favorite place is together</p><h1>${esc(pet)}</h1>${title&&title!==pet?`<p class="subtitle">${esc(title)}</p>`:""}</div>${hero}</header>${m.story?`<section class="story"><h2>Life with ${esc(pet)}</h2><p>${esc(m.story)}</p></section>`:""}${gallery}${timeline.length?`<section class="section"><div class="section-head"><h2>Little moments,<br>big love</h2><p>The days that made this story ours.</p></div><div class="timeline">${timeline.map(x=>`<article class="moment"><time>${esc(x.date)}</time><h3>${esc(x.title)}</h3>${x.text?`<p>${esc(x.text)}</p>`:""}</article>`).join("")}</div></section>`:""}${video.length?`<section class="section"><div class="section-head"><h2>See the joy</h2><p>Favorite moments, always ready to replay.</p></div><div class="media-list">${videos(video)}</div></section>`:""}${audio.length?`<section class="section"><div class="section-head"><h2>Sounds like home</h2></div><div class="media-list">${sounds(audio)}</div></section>`:""}<footer class="footer"><strong>${esc(pet)}</strong><br>Forever part of the family.</footer>`;
    }catch(error){document.getElementById("app").innerHTML='<p class="error">This Memory Page is temporarily unavailable.</p>'}
  </script>
</body>
</html>
