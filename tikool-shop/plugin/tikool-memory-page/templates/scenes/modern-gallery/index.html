<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Memory Page</title>
  <style>
    :root{--black:#101010;--white:#f7f7f4;--gray:#8b8b86;--line:#d8d8d2;--accent:#bbff35}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--white);color:var(--black);font:15px/1.55 Arial,Helvetica,sans-serif}.topbar{align-items:center;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;padding:18px clamp(20px,4vw,64px);position:relative}.mark{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.count{color:var(--gray);font-variant-numeric:tabular-nums}.hero{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);min-height:calc(100vh - 58px)}.hero-copy{align-content:end;background:var(--black);color:white;display:grid;padding:clamp(30px,6vw,90px)}.index{color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(4rem,10vw,10rem);font-weight:800;letter-spacing:-.075em;line-height:.76;margin:.24em 0;overflow-wrap:anywhere}.hero-title{color:#bdbdb7;font-size:clamp(1rem,2vw,1.35rem);margin:0;max-width:30rem}.hero-image{background:#d9d9d4;min-height:480px;overflow:hidden}.hero-image img{display:block;height:100%;object-fit:cover;width:100%}.intro{display:grid;gap:2rem;grid-template-columns:1fr 2fr;margin:auto;max-width:1260px;padding:clamp(70px,12vw,170px) clamp(20px,4vw,64px)}.label{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.intro p{font-size:clamp(1.5rem,3.5vw,3.4rem);font-weight:500;letter-spacing:-.035em;line-height:1.18;margin:0;white-space:pre-line}.gallery{display:grid;gap:3px;grid-auto-flow:dense;grid-template-columns:repeat(12,1fr);padding:3px}.gallery figure{grid-column:span 4;margin:0;min-height:300px;overflow:hidden}.gallery figure:nth-child(5n+1){grid-column:span 8;grid-row:span 2}.gallery figure:nth-child(5n+4){grid-column:span 6}.gallery img{display:block;height:100%;min-height:300px;object-fit:cover;transition:transform .45s ease;width:100%}.gallery figure:hover img{transform:scale(1.018)}.section{border-top:1px solid var(--line);margin:auto;max-width:1260px;padding:clamp(65px,10vw,130px) clamp(20px,4vw,64px)}.section-header{display:grid;gap:1.5rem;grid-template-columns:1fr 2fr;margin-bottom:3rem}.section h2{font-size:clamp(2.8rem,7vw,6.5rem);letter-spacing:-.065em;line-height:.86;margin:0}.timeline{border-top:2px solid var(--black)}.moment{align-items:start;border-bottom:1px solid var(--line);display:grid;gap:2rem;grid-template-columns:150px 1fr 2fr;padding:1.5rem 0}.moment time{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.moment h3{font-size:1.25rem;margin:0}.moment p{color:#555;margin:0;white-space:pre-line}.video-grid{display:grid;gap:3px;grid-template-columns:repeat(2,minmax(0,1fr))}.video-grid video{background:#000;display:block;max-height:78vh;width:100%}.audio-grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:repeat(2,minmax(0,1fr))}.audio-card{background:var(--white);padding:1.4rem}.audio-card span{display:block;font-size:.78rem;font-weight:700;margin-bottom:.9rem;overflow-wrap:anywhere;text-transform:uppercase}.audio-card audio{width:100%}.end{background:var(--accent);font-size:clamp(2.8rem,8vw,7rem);font-weight:800;letter-spacing:-.06em;line-height:.9;padding:clamp(55px,10vw,140px) clamp(20px,4vw,64px)}.loading,.error{display:grid;min-height:100vh;place-items:center}.error{color:#8c261b}@media(max-width:760px){.hero{grid-template-columns:1fr}.hero-copy{min-height:55vh}.hero-image{min-height:55vh}.intro,.section-header{grid-template-columns:1fr}.gallery figure,.gallery figure:nth-child(n){grid-column:span 12;grid-row:auto}.moment{gap:.5rem;grid-template-columns:1fr}.video-grid,.audio-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.gallery img{transition:none}}
  </style>
</head>
<body>
  <main id="app"><p class="loading">Loading gallery…</p></main>
  <script>
    window.__TIKOOL_MEMORY_MANIFEST__=__TIKOOL_MEMORY_MANIFEST_JSON__;
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    try{
      const m=window.__TIKOOL_MEMORY_MANIFEST__;if(!m||typeof m!=="object")throw Error("invalid manifest");
      const pet=String(m.pet?.name||m.title||"Pet portrait"),title=String(m.title||"");
      const photos=m.media?.photos||[],videos=m.media?.videos||[],audio=m.media?.audio||[],timeline=m.timeline||[];
      document.title=title||pet;
      const hero=photos[0]?`<div class="hero-image"><img src="${esc(photos[0].src)}" alt="${esc(pet)}" fetchpriority="high"></div>`:"";
      const gallery=photos.length>1?`<section class="gallery" aria-label="Photo gallery">${photos.slice(1).map(x=>`<figure><img src="${esc(x.src)}" alt="${esc(pet)}" loading="lazy"></figure>`).join("")}</section>`:"";
      const motion=videos.map(x=>`<video controls preload="metadata" playsinline src="${esc(x.src)}" aria-label="${esc(x.name||"Pet memory video")}"></video>`).join("");
      const sound=audio.map(x=>`<div class="audio-card"><span>${esc(x.name||"Audio memory")}</span><audio controls preload="metadata" src="${esc(x.src)}"></audio></div>`).join("");
      document.getElementById("app").innerHTML=`<div class="topbar"><span class="mark">Tikool · Memory Collection</span><span class="count">${String(photos.length).padStart(2,"0")} photographs</span></div><header class="hero"><div class="hero-copy"><span class="index">Portrait / 001</span><h1>${esc(pet)}</h1>${title&&title!==pet?`<p class="hero-title">${esc(title)}</p>`:""}</div>${hero}</header>${m.story?`<section class="intro"><span class="label">The story</span><p>${esc(m.story)}</p></section>`:""}${gallery}${timeline.length?`<section class="section"><div class="section-header"><span class="label">Chronology</span><h2>Moments<br>that matter.</h2></div><div class="timeline">${timeline.map(x=>`<article class="moment"><time>${esc(x.date)}</time><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join("")}</div></section>`:""}${videos.length?`<section class="section"><div class="section-header"><span class="label">Motion</span><h2>Press play.</h2></div><div class="video-grid">${motion}</div></section>`:""}${audio.length?`<section class="section"><div class="section-header"><span class="label">Sound archive</span><h2>Listen again.</h2></div><div class="audio-grid">${sound}</div></section>`:""}<footer class="end">${esc(pet)}<br>in every frame.</footer>`;
    }catch(error){document.getElementById("app").innerHTML='<p class="error">This Memory Page is temporarily unavailable.</p>'}
  </script>
</body>
</html>
