<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff745c">
  <title>Memory Page</title>
  <style>
    :root{--coral:#ff745c;--sun:#ffd84a;--blue:#63c7e8;--mint:#83d7af;--plum:#49304f;--paper:#fff9ed;--ink:#302530}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Trebuchet MS",ui-rounded,system-ui,sans-serif;overflow-x:hidden}.shell{margin:auto;max-width:1180px;padding:clamp(18px,4vw,56px)}.hero{background:var(--coral);border:3px solid var(--ink);border-radius:36px;box-shadow:10px 10px 0 var(--ink);display:grid;gap:clamp(22px,5vw,60px);grid-template-columns:1fr 1fr;min-height:78vh;overflow:hidden;padding:clamp(28px,6vw,80px);position:relative}.hero:before,.hero:after{border:3px solid var(--ink);border-radius:50%;content:"";position:absolute}.hero:before{background:var(--sun);height:120px;right:-28px;top:-30px;width:120px}.hero:after{background:var(--blue);bottom:-50px;height:150px;left:38%;width:150px}.hero-copy{align-self:center;position:relative;z-index:1}.badge{background:var(--sun);border:2px solid var(--ink);border-radius:999px;display:inline-block;font-size:.73rem;font-weight:900;letter-spacing:.12em;padding:.55rem .85rem;text-transform:uppercase;transform:rotate(-2deg)}h1{font-size:clamp(4rem,11vw,9rem);font-weight:900;letter-spacing:-.075em;line-height:.76;margin:.22em 0;overflow-wrap:anywhere}.subtitle{font-size:clamp(1.15rem,2.4vw,1.7rem);font-weight:800;margin:0}.hero-photo{align-self:center;background:var(--paper);border:3px solid var(--ink);border-radius:50% 44% 48% 42%;box-shadow:9px 9px 0 var(--ink);height:min(58vw,560px);min-height:340px;overflow:hidden;position:relative;transform:rotate(2deg);z-index:1}.hero-photo img{display:block;height:100%;object-fit:cover;width:100%}.story{align-items:start;display:grid;gap:clamp(24px,5vw,70px);grid-template-columns:.8fr 2fr;padding:clamp(80px,13vw,160px) 1rem}.story h2,.section h2{font-size:clamp(2.7rem,6vw,5.5rem);letter-spacing:-.06em;line-height:.9;margin:0}.story p{background:white;border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--sun);font-size:clamp(1.1rem,2vw,1.45rem);margin:0;padding:clamp(24px,4vw,48px);white-space:pre-line}.gallery{display:grid;gap:16px;grid-auto-flow:dense;grid-template-columns:repeat(12,1fr)}.gallery figure{border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);grid-column:span 4;margin:0;overflow:hidden}.gallery figure:nth-child(6n+1){grid-column:span 7;grid-row:span 2}.gallery figure:nth-child(6n+2){grid-column:span 5}.gallery figure:nth-child(3n){box-shadow:6px 6px 0 var(--blue)}.gallery figure:nth-child(3n+1){box-shadow:6px 6px 0 var(--mint)}.gallery img{display:block;height:100%;min-height:260px;object-fit:cover;width:100%}.section{padding:clamp(80px,13vw,150px) 0 0}.section-head{align-items:end;display:flex;gap:2rem;justify-content:space-between;margin:0 0 2.2rem}.section-head span{background:var(--mint);border:2px solid var(--ink);border-radius:999px;font-size:.75rem;font-weight:900;padding:.5rem .8rem;text-transform:uppercase}.timeline{display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr))}.moment{border:3px solid var(--ink);border-radius:20px;min-height:220px;padding:1.4rem}.moment:nth-child(4n+1){background:#ffeaa0}.moment:nth-child(4n+2){background:#bdebd5}.moment:nth-child(4n+3){background:#afe2f2}.moment:nth-child(4n){background:#ffc3b7}.moment time{font-size:.76rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.moment h3{font-size:1.45rem;line-height:1.12;margin:.55rem 0}.moment p{margin:0;white-space:pre-line}.media-grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}.media-grid video{background:#1d161c;border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--blue);max-height:72vh;width:100%}.audio-card{background:white;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--sun);padding:1.1rem}.audio-card span{display:block;font-size:.82rem;font-weight:900;margin-bottom:.65rem;overflow-wrap:anywhere}.audio-card audio{width:100%}.footer{background:var(--plum);border-radius:30px;color:white;margin-top:clamp(90px,14vw,170px);overflow:hidden;padding:clamp(45px,8vw,95px);position:relative;text-align:center}.footer:after{color:var(--sun);content:"✦";font-size:8rem;opacity:.18;position:absolute;right:5%;top:-25px}.footer strong{color:var(--sun);display:block;font-size:clamp(2.8rem,8vw,7rem);letter-spacing:-.06em;line-height:.9}.loading,.error{display:grid;min-height:100vh;place-items:center}.error{color:#8c261b}@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:auto}.hero-photo{height:88vw}.story{grid-template-columns:1fr}.gallery figure,.gallery figure:nth-child(n){grid-column:span 12;grid-row:auto}.timeline{grid-template-columns:1fr}.media-grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main class="shell" id="app"><p class="loading">Bringing on the happy…</p></main>
  <script>
    window.__TIKOOL_MEMORY_MANIFEST__=__TIKOOL_MEMORY_MANIFEST_JSON__;
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    try{
      const m=window.__TIKOOL_MEMORY_MANIFEST__;if(!m||typeof m!=="object")throw Error("invalid manifest");
      const pet=String(m.pet?.name||m.title||"Best friend"),title=String(m.title||"");
      const photos=m.media?.photos||[],videos=m.media?.videos||[],audio=m.media?.audio||[],timeline=m.timeline||[];
      document.title=title||pet;
      const hero=photos[0]?`<div class="hero-photo"><img src="${esc(photos[0].src)}" alt="${esc(pet)}" fetchpriority="high"></div>`:"";
      const gallery=photos.length>1?`<section class="gallery" aria-label="Happy photo memories">${photos.slice(1).map(x=>`<figure><img src="${esc(x.src)}" alt="${esc(pet)}" loading="lazy"></figure>`).join("")}</section>`:"";
      const motion=videos.map(x=>`<video controls preload="metadata" playsinline src="${esc(x.src)}" aria-label="${esc(x.name||"Happy memory video")}"></video>`).join("");
      const sound=audio.map(x=>`<div class="audio-card"><span>▶ ${esc(x.name||"A sound we love")}</span><audio controls preload="metadata" src="${esc(x.src)}"></audio></div>`).join("");
      document.getElementById("app").innerHTML=`<header class="hero"><div class="hero-copy"><span class="badge">Best days ever</span><h1>${esc(pet)}!</h1>${title&&title!==pet?`<p class="subtitle">${esc(title)}</p>`:""}</div>${hero}</header>${m.story?`<section class="story"><h2>Why we<br>love you</h2><p>${esc(m.story)}</p></section>`:""}${gallery}${timeline.length?`<section class="section"><div class="section-head"><h2>So many<br>good days</h2><span>Favorite milestones</span></div><div class="timeline">${timeline.map(x=>`<article class="moment"><time>${esc(x.date)}</time><h3>${esc(x.title)}</h3>${x.text?`<p>${esc(x.text)}</p>`:""}</article>`).join("")}</div></section>`:""}${videos.length?`<section class="section"><div class="section-head"><h2>Action!</h2><span>Moments in motion</span></div><div class="media-grid">${motion}</div></section>`:""}${audio.length?`<section class="section"><div class="section-head"><h2>Turn it up</h2><span>Favorite sounds</span></div><div class="media-grid">${sound}</div></section>`:""}<footer class="footer"><strong>${esc(pet)}</strong>Made every day the best day.</footer>`;
    }catch(error){document.getElementById("app").innerHTML='<p class="error">This Memory Page is temporarily unavailable.</p>'}
  </script>
</body>
</html>
