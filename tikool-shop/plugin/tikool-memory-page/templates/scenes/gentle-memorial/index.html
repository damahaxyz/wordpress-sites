<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ede9e1">
  <title>Memory Page</title>
  <style>
    :root{--ivory:#f6f3ed;--mist:#e5e7e1;--ink:#343630;--muted:#73766d;--olive:#7a806f;--gold:#b89a67;--line:#d7d6cd}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#e9ebe6,var(--ivory) 34rem);color:var(--ink);font:16px/1.75 Georgia,"Times New Roman",serif}.shell{margin:auto;max-width:1040px;padding:clamp(24px,6vw,90px)}.hero{text-align:center}.symbol{align-items:center;color:var(--olive);display:flex;font:600 .68rem/1.2 Arial,sans-serif;gap:14px;justify-content:center;letter-spacing:.2em;text-transform:uppercase}.symbol:before,.symbol:after{background:var(--gold);content:"";height:1px;width:58px}.hero h1{font-size:clamp(3.5rem,10vw,8rem);font-weight:400;letter-spacing:-.05em;line-height:.9;margin:.3em 0}.subtitle{color:var(--muted);font-size:clamp(1.05rem,2vw,1.35rem);font-style:italic;margin:0 auto 3rem;max-width:640px}.portrait{margin:0 auto;max-width:760px;position:relative}.portrait:before{border:1px solid var(--gold);content:"";inset:-14px;position:absolute}.portrait img{display:block;max-height:78vh;object-fit:cover;width:100%}.story{margin:clamp(80px,14vw,170px) auto;max-width:780px;text-align:center}.story:before{color:var(--gold);content:"✦";display:block;font-size:1.1rem;margin-bottom:2rem}.story h2,.section h2{font-size:clamp(2.3rem,5vw,4.5rem);font-weight:400;letter-spacing:-.035em;line-height:1.05;margin:0 0 1.5rem}.story p{color:#55584f;font-size:clamp(1.1rem,2.3vw,1.45rem);margin:0;white-space:pre-line}.section{border-top:1px solid var(--line);padding:clamp(60px,10vw,110px) 0}.section-header{margin-bottom:2.5rem;text-align:center}.section-header span{color:var(--olive);display:block;font:700 .68rem Arial,sans-serif;letter-spacing:.18em;margin-bottom:.8rem;text-transform:uppercase}.gallery{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.gallery figure{margin:0;overflow:hidden}.gallery figure:nth-child(3n){grid-column:1/-1}.gallery img{display:block;height:100%;max-height:72vh;min-height:300px;object-fit:cover;width:100%}.timeline{margin:auto;max-width:760px}.moment{display:grid;gap:1.5rem;grid-template-columns:120px 1fr;padding:0 0 3.2rem 2.1rem;position:relative}.moment:before{background:var(--ivory);border:1px solid var(--gold);border-radius:50%;content:"";height:13px;left:-6px;position:absolute;top:.45rem;width:13px}.moment:not(:last-child):after{background:var(--line);content:"";height:100%;left:0;position:absolute;top:.95rem;width:1px}.moment time{color:var(--olive);font:700 .72rem Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}.moment h3{font-size:1.55rem;font-weight:400;line-height:1.25;margin:0}.moment p{color:var(--muted);margin:.45rem 0 0;white-space:pre-line}.media-list{display:grid;gap:20px;margin:auto;max-width:820px}.media-list video{background:#171815;max-height:74vh;width:100%}.audio-card{background:#fff9;border:1px solid var(--line);padding:1.25rem}.audio-card span{color:var(--muted);display:block;font:700 .75rem Arial,sans-serif;letter-spacing:.06em;margin-bottom:.8rem;overflow-wrap:anywhere;text-transform:uppercase}.audio-card audio{width:100%}.closing{padding:clamp(70px,12vw,140px) 0;text-align:center}.closing span{color:var(--gold);display:block;font-size:1.25rem}.closing strong{display:block;font-size:clamp(2rem,5vw,4.3rem);font-weight:400;letter-spacing:-.03em;margin:.7rem 0}.closing p{color:var(--muted);font-style:italic}.loading,.error{display:grid;min-height:100vh;place-items:center}.error{color:#873c34}@media(max-width:650px){.shell{padding:28px 20px}.portrait:before{inset:-7px}.gallery{grid-template-columns:1fr}.gallery figure:nth-child(n){grid-column:auto}.moment{gap:.35rem;grid-template-columns:1fr;padding-left:1.6rem}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main class="shell" id="app"><p class="loading">Opening this remembrance…</p></main>
  <script>
    window.__TIKOOL_MEMORY_MANIFEST__=__TIKOOL_MEMORY_MANIFEST_JSON__;
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    try{
      const m=window.__TIKOOL_MEMORY_MANIFEST__;if(!m||typeof m!=="object")throw Error("invalid manifest");
      const pet=String(m.pet?.name||m.title||"A beloved companion"),title=String(m.title||"");
      const photos=m.media?.photos||[],videos=m.media?.videos||[],audio=m.media?.audio||[],timeline=m.timeline||[];
      document.title=title||`Remembering ${pet}`;
      const portrait=photos[0]?`<figure class="portrait"><img src="${esc(photos[0].src)}" alt="${esc(pet)}" fetchpriority="high"></figure>`:"";
      const gallery=photos.length>1?`<section class="section"><div class="section-header"><span>In photographs</span><h2>A beautiful life</h2></div><div class="gallery">${photos.slice(1).map(x=>`<figure><img src="${esc(x.src)}" alt="${esc(pet)}" loading="lazy"></figure>`).join("")}</div></section>`:"";
      const motion=videos.map(x=>`<video controls preload="metadata" playsinline src="${esc(x.src)}" aria-label="${esc(x.name||"Memory video")}"></video>`).join("");
      const sound=audio.map(x=>`<div class="audio-card"><span>${esc(x.name||"A treasured sound")}</span><audio controls preload="metadata" src="${esc(x.src)}"></audio></div>`).join("");
      document.getElementById("app").innerHTML=`<header class="hero"><span class="symbol">In loving memory</span><h1>${esc(pet)}</h1>${title&&title!==pet?`<p class="subtitle">${esc(title)}</p>`:""}${portrait}</header>${m.story?`<section class="story"><h2>Forever loved,<br>always remembered</h2><p>${esc(m.story)}</p></section>`:""}${audio.length?`<section class="section"><div class="section-header"><span>Listen and remember</span><h2>A voice held close</h2></div><div class="media-list">${sound}</div></section>`:""}${gallery}${timeline.length?`<section class="section"><div class="section-header"><span>Life and love</span><h2>Our time together</h2></div><div class="timeline">${timeline.map(x=>`<article class="moment"><time>${esc(x.date)}</time><div><h3>${esc(x.title)}</h3>${x.text?`<p>${esc(x.text)}</p>`:""}</div></article>`).join("")}</div></section>`:""}${videos.length?`<section class="section"><div class="section-header"><span>In motion</span><h2>Memories that live on</h2></div><div class="media-list">${motion}</div></section>`:""}<footer class="closing"><span>✦</span><strong>${esc(pet)}</strong><p>Love leaves a memory no one can take away.</p></footer>`;
    }catch(error){document.getElementById("app").innerHTML='<p class="error">This Memory Page is temporarily unavailable.</p>'}
  </script>
</body>
</html>
