name: ${COMPOSE_PROJECT_NAME:-13799-shop}

services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MARIADB_HOST_PORT:-3307}:3306"
    networks:
      - backend
      - management
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  wordpress:
    image: ${WORDPRESS_IMAGE:-wordpress:7.0-php8.3-fpm}
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_HOME: ${WORDPRESS_HOME:-https://www.13799.com}
      WORDPRESS_SITEURL: ${WORDPRESS_SITEURL:-https://www.13799.com}
      WORDPRESS_REDIS_HOST: redis
      WORDPRESS_REDIS_PORT: 6379
      WORDPRESS_REDIS_DATABASE: ${WORDPRESS_REDIS_DATABASE:-0}
      WORDPRESS_REDIS_PREFIX: "${COMPOSE_PROJECT_NAME:-13799-shop}:"
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '500M');
        define('WP_MAX_MEMORY_LIMIT', '500M');
        define('WP_HOME', getenv('WORDPRESS_HOME') ?: 'https://www.13799.com');
        define('WP_SITEURL', getenv('WORDPRESS_SITEURL') ?: 'https://www.13799.com');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
            $$_SERVER['HTTPS'] = 'on';
        }
        define('WP_REDIS_HOST', getenv('WORDPRESS_REDIS_HOST') ?: 'redis');
        define('WP_REDIS_PORT', (int) (getenv('WORDPRESS_REDIS_PORT') ?: 6379));
        define('WP_REDIS_DATABASE', (int) (getenv('WORDPRESS_REDIS_DATABASE') ?: 0));
        define('WP_REDIS_PREFIX', getenv('WORDPRESS_REDIS_PREFIX') ?: '13799-shop:');
        define('WP_REDIS_TIMEOUT', 1);
        define('WP_REDIS_READ_TIMEOUT', 1);
    volumes:
      - wordpress_data:/var/www/html
      - ./theme/13799:/var/www/html/wp-content/themes/13799
      - ./plugin/13799-plugin:/var/www/html/wp-content/plugins/13799-plugin
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_IP:-127.0.0.1}:${HTTP_PORT:-8081}:80"
    volumes:
      - wordpress_data:/var/www/html:ro
      # Nginx 需要直接读取自定义主题和插件的静态资源。
      - ./theme/13799:/var/www/html/wp-content/themes/13799:ro
      - ./plugin/13799-plugin:/var/www/html/wp-content/plugins/13799-plugin:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      # 首次安装时 WordPress 会将 HTTP 跳转到正式 HTTPS 域名，
      # 使用 nginx -t 可避免 wget 跟随跳转后产生假阴性。
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db_data:
  wordpress_data:

networks:
  frontend:
  backend:
    internal: true
  management:
