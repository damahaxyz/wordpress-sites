include /etc/nginx/snippets/cloudflare-only.conf;

server {
    listen 80;
    listen [::]:80;
    server_name 13799.com www.13799.com;

    if ($aromamatrix_from_cloudflare = 0) {
        return 444;
    }

    return 301 https://www.13799.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 13799.com www.13799.com;

    if ($aromamatrix_from_cloudflare = 0) {
        return 444;
    }

    if ($host = 13799.com) {
        return 301 https://www.13799.com$request_uri;
    }

    ssl_certificate /etc/nginx/ssl/www.13799.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.13799.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:shop_13799_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
