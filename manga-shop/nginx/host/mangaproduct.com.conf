include /etc/nginx/snippets/cloudflare-only.conf;

server {
    listen 80;
    listen [::]:80;
    server_name mangaproduct.com www.mangaproduct.com;

    if ($aromamatrix_from_cloudflare = 0) {
        return 444;
    }

    return 301 https://www.mangaproduct.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mangaproduct.com;

    if ($aromamatrix_from_cloudflare = 0) {
        return 444;
    }

    ssl_certificate /etc/nginx/ssl/mangaproduct.com.pem;
    ssl_certificate_key /etc/nginx/ssl/mangaproduct.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:manga_shop_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.mangaproduct.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mangaproduct.com;

    if ($aromamatrix_from_cloudflare = 0) {
        return 444;
    }

    ssl_certificate /etc/nginx/ssl/mangaproduct.com.pem;
    ssl_certificate_key /etc/nginx/ssl/mangaproduct.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:manga_shop_www_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
