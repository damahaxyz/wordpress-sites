# Temporary origin configuration for the legacy Manga Product host on contabo2.
# Cloudflare terminates public TLS; this origin uses a Cloudflare Origin CA cert.

server {
    listen 80;
    listen [::]:80;
    server_name www.mangaproduct.com;

    return 301 https://www.mangaproduct.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mangaproduct.com;

    ssl_certificate /root/ssl/www.mangaproduct.com/cloudflare-origin.pem;
    ssl_certificate_key /root/ssl/www.mangaproduct.com/cloudflare-origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:manga_legacy_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ~ /\.ht {
        deny all;
    }
}
